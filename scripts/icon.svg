<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- House Green field carrying the week view's own bars as the mark.
       The accent bars use Green Light, not Green Accent: a #00754A bar on a
       #1E3932 field is the green-on-green collision DESIGN.md warns about. -->
  <rect width="512" height="512" fill="#1E3932"/>
  <g>
    <rect x="110" y="140" width="164" height="56" rx="28" fill="#d4e9e2"/>
    <rect x="110" y="228" width="292" height="56" rx="28" fill="#ffffff"/>
    <rect x="110" y="316" width="210" height="56" rx="28" fill="#d4e9e2"/>
  </g>
</svg>
